<div class="pagehead">
    <img src="/img/ig-harvest-bins.jpg" alt="">
    <div class="wrap">
      <h1>Wines</h1>
      <p class="lede">Estate grown. Hand-picked. Schuylkill County terroir in every bottle.</p>
    </div>
  </div>
  <div class="band" style="padding-top:2.5rem">
    <div class="wrap">
      <div class="filters">
        <div class="chips" role="group" aria-label="Filter">
          <button class="chip" type="button" data-f="all" aria-pressed="true">All</button>
          <button class="chip" type="button" data-f="red" aria-pressed="false">Red</button>
          <button class="chip" type="button" data-f="white" aria-pressed="false">White</button>
          <button class="chip" type="button" data-f="sets" aria-pressed="false">Gift sets</button>
        </div>
        <div class="selects">
          <label class="sel"><span class="vh">Varietal</span><select id="fVar"><option value="">All varietals</option></select></label>
          <label class="sel"><span class="vh">Sort</span><select id="fSort"><option value="feat">Featured</option><option value="asc">Price: low to high</option><option value="desc">Price: high to low</option></select></label>
        </div>
      </div>
      <p class="kkey" id="kkey"></p>
      <div class="ledger" id="ledger"></div>
      <div class="shipnote">
        <div><b>Shipping</b>Varies by <button type="button" class="states-link">state</button>. Free on orders over $50.</div>
        <div><b>Pickup</b>Free at the vineyard.</div>
      </div>
    </div>
  </div>
